# EIP-8025 "optional execution proofs" interop devnet: Teku alongside eth-act/lighthouse's
# optional-proofs branch, both pointed at a shared zkboost prover/verifier service.
#
# This forks the shape of ethpandaops/ethereum-package's own
# .github/tests/zkboost.yaml (the real, working zkboost devnet config - confirmed by reading
# eth-act/lighthouse's optional-proofs branch source directly, not guessed), adding a Teku
# participant using this branch's --Xexecution-proof-* flags in place of Lighthouse's
# --proof-engine-endpoint / --proof-types.
#
# The zkboost instance is left on its default mock zkVM backend (see zkboost_params in
# ethereum-package's own README) so this devnet needs no GPU and no real prover binary - it
# simulates proving with randomized timing, which is enough to exercise the full submit -> sign ->
# gossip -> verify -> ACCEPT path end-to-end.
#
# Run with (from a checkout of ethpandaops/ethereum-package):
#   kurtosis run --enclave eip8025-devnet . --args-file /path/to/this/file.yaml
#
# Teku's image must be built from this (optional-proofs) branch first, since
# --Xstateless-validation-enabled / --Xexecution-proof-* are new flags not in any released image:
#   ./gradlew distDocker
# then reference it below as cl_image: consensys/teku:develop (already set).
#
# reth/lighthouse/zkboost images below are tagged :local rather than pulled from GHCR -
# ghcr.io/paradigmxyz/reth and ghcr.io/eth-act/zkboost/zkboost reject anonymous pulls, and
# ethpandaops/lighthouse:eth-act-optional-proofs is no longer usable either, so all three must be
# built locally:
#   git clone https://github.com/paradigmxyz/reth && cd reth && docker build -t reth:local . && cd ..
#   git clone --branch optional-proofs https://github.com/eth-act/lighthouse && cd lighthouse && docker build -t lighthouse:local . && cd ..
#   git clone https://github.com/eth-act/zkboost && cd zkboost && docker build -t zkboost:local -f docker/Dockerfile . && cd ..
# reth and lighthouse are large Rust release builds - expect them to take a while the first time;
# Docker layer caching makes subsequent rebuilds much faster.
#
# Success criteria (see EIP-8025 gap-analysis M9 notes):
#   1. A block proposed by either client gets a proof generated by the shared zkboost instance,
#      signed by that client's validator client, and submitted.
#   2. The resulting SignedExecutionProof gossips over the single "execution_proof" topic and is
#      ACCEPTed by the *other* client type's beacon node - the core cross-client interop assertion.
#   3. No block import is ever blocked or delayed by proof presence/absence on either client
#      (Teku: see ExecutionProofsAvailabilityChecker javadoc for why this can't regress).
#
# Out of scope for this pass (matches the gap-analysis's explicitly deferred items): EL-optional /
# verify-only mode, req/resp backfill, ENR advertisement of proof-topic support.

participants:
  - cl_type: lighthouse
    cl_image: lighthouse:local
    el_type: reth
    el_image: reth:local
    supernode: true
    cl_extra_params:
      - --target-peers=3
      - --proof-engine-endpoint=http://zkboost:3000
      - --proof-types=5
    vc_extra_params:
      - --proof-engine-endpoint=http://zkboost:3000
      - --proof-types=5
    count: 1

  - cl_type: teku
    cl_image: consensys/teku:develop
    el_type: reth
    el_image: reth:local
    supernode: false
    cl_extra_params:
      - --Xstateless-validation-enabled=true
      - --Xexecution-proof-verifier-endpoint=http://zkboost:3000
      - --Xexecution-proof-prover-enabled=true
      - --Xexecution-proof-prover-endpoint=http://zkboost:3000
      - --Xexecution-proof-type=reth-zisk
    count: 1

network_params:
  seconds_per_slot: 12

additional_services:
  - zkboost
  - dora
  - prometheus
  - grafana

zkboost_params:
  image: zkboost:local
  instances:
    - name: zkboost
      # Index 0 -> the Lighthouse participant's reth EL above. zkboost watches this EL directly
      # for new blocks; the specific proving validator/client doesn't matter to it - it proves
      # whatever block lands on its configured EL, regardless of which CL proposed it.
      el_participant_index: 0
  # zkvms intentionally omitted - ethereum-package auto-configures a mock reth-zisk backend with
  # randomized proving time scaled to slot duration when this list is empty. Swap in a real
  # `kind: ere` entry (see ethereum-package's own README for the shape) to exercise a real zkVM.
